<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMAP - Centro de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: { extend: { colors: { transaltisa: { primary: '#0B336A', secondary: '#1A52A0', hover: '#134080' } } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased relative">

    <nav class="bg-transaltisa-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-satellite-dish text-2xl text-blue-300"></i>
                <h1 onclick="abrirModalPass()" class="text-xl font-bold tracking-wider cursor-pointer hover:text-blue-200 transition">SGMAP <span class="text-sm font-light text-blue-200">| Centro de Control</span></h1>
            </div>
            <div class="text-sm font-medium"><i class="fas fa-user-circle text-lg align-middle mr-1"></i> Centro de Control</div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Panel Izquierdo: Formulario -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">Generar Nuevo Ticket</h2>
                <form id="ticketForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Proveedor</label>
                        <select id="proveedor" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-transaltisa-secondary outline-none" required>
                            <option value="">Cargando proveedores...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Proyecto / Operación</label>
                        <select id="proyecto" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-transaltisa-secondary outline-none" required>
                            <option value="">Seleccionar Proyecto...</option>
                            <option value="Transaltisa">Transaltisa</option>
                            <option value="Quellaveco">Quellaveco</option>
                            <option value="Marcobre Concentrado">Marcobre Concentrado</option>
                            <option value="Antamina">Antamina</option>
                            <option value="Flota Spot Arequipa">Flota Spot Arequipa</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Unidad</label>
                            <input type="text" id="unidad" placeholder="Ej. BEY899" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-transaltisa-secondary uppercase outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Prioridad</label>
                            <select id="prioridad" class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-transaltisa-secondary outline-none">
                                <option value="Media">Media (48h)</option>
                                <option value="Alta">Alta (24h)</option>
                                <option value="Crítica">Crítica (4h)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Detalle de Incidencia</label>
                        <textarea id="incidencia" rows="3" placeholder="Descripción de la falla..." class="w-full rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-transaltisa-secondary outline-none" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-transaltisa-secondary hover:bg-transaltisa-hover text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md flex justify-center items-center gap-2">
                        <i class="fas fa-paper-plane"></i> Enviar y Notificar
                    </button>
                    <p id="statusMsg" class="text-sm text-center font-medium mt-2 hidden"></p>
                </form>
            </div>
        </div>

        <!-- Panel Derecho: Dashboard y KPIs -->
        <div class="lg:col-span-2 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 border-l-4 border-transaltisa-secondary">
                    <div class="text-slate-500 text-sm font-semibold mb-1">Tickets Abiertos</div>
                    <div id="kpi-abiertos" class="text-3xl font-bold text-slate-800">0</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 border-l-4 border-l-amber-500">
                    <div class="text-slate-500 text-sm font-semibold mb-1">Próximos a Vencer</div>
                    <div id="kpi-proximos" class="text-3xl font-bold text-slate-800">0</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 border-l-4 border-l-red-500">
                    <div class="text-slate-500 text-sm font-semibold mb-1">Vencidos (>48h)</div>
                    <div id="kpi-vencidos" class="text-3xl font-bold text-slate-800">0</div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex flex-wrap justify-between items-center gap-4">
                    <h2 class="text-lg font-bold text-slate-700">Seguimiento en Tiempo Real</h2>
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                            <input type="text" id="buscador" placeholder="Buscar placa, ticket..." class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-transaltisa-secondary w-full md:w-64 outline-none">
                        </div>
                        <button class="text-transaltisa-secondary bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-semibold transition" onclick="cargarDatosGenerales()"><i class="fas fa-sync-alt mr-1"></i></button>
                    </div>
                </div>
                
                <div class="overflow-x-auto max-h-96">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white shadow-sm">
                            <tr class="text-slate-500 text-xs uppercase tracking-wider border-b">
                                <th class="p-4 font-semibold">Ticket</th>
                                <th class="p-4 font-semibold">Proveedor</th>
                                <th class="p-4 font-semibold">Unidad</th>
                                <th class="p-4 font-semibold">Estado</th>
                                <th class="p-4 font-semibold">SLA (Real)</th>
                                <th class="p-4 font-semibold text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo" class="text-sm text-slate-600 divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONTRASEÑA -->
    <div id="passModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-[60] flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 relative">
            <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-lock text-slate-500 mr-2"></i>Acceso Restringido</h2>
            <input type="password" id="adminPass" placeholder="Ingrese contraseña" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-transaltisa-secondary outline-none mb-4" onkeypress="if(event.key === 'Enter') verificarClave()">
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('passModal').classList.add('hidden')" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-medium">Cancelar</button>
                <button onclick="verificarClave()" class="px-4 py-2 bg-transaltisa-secondary text-white rounded-lg hover:bg-transaltisa-hover font-bold">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ADMINISTRACIÓN -->
    <div id="adminModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 border-t-4 border-transaltisa-primary relative transform transition-all">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="text-lg font-bold text-slate-800"><i class="fas fa-user-shield text-transaltisa-secondary mr-2"></i>Gestión de Proveedores</h2>
                <button onclick="cerrarAdmin()" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <form id="adminForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Proveedor</label>
                    <input type="text" id="nuevoProveedor" placeholder="Ej. WISETRACK" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-transaltisa-secondary uppercase outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correos (separados por comas)</label>
                    <textarea id="nuevoCorreos" rows="3" placeholder="ejemplo1@empresa.com, ejemplo2@empresa.com" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-2 focus:ring-transaltisa-secondary lowercase outline-none" required></textarea>
                </div>
                <button type="submit" id="btnGuardarProv" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <i class="fas fa-save"></i> Guardar en Base de Datos
                </button>
                <p id="adminMsg" class="text-sm text-center font-bold mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('ticketForm');
        const statusMsg = document.getElementById('statusMsg');
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx15wi9JZETi278WnqdS2L_5xq2bdwr7nV53gJRi1UknR8oec3sUhQ1Nk4GnflCmRIG/exec';

        document.getElementById('buscador').addEventListener('input', function(e) {
            const filtro = e.target.value.toLowerCase();
            const filas = document.querySelectorAll('#tablaCuerpo tr');
            filas.forEach(fila => {
                const texto = fila.textContent.toLowerCase();
                fila.style.display = texto.includes(filtro) ? '' : 'none';
            });
        });

        function abrirModalPass() {
            document.getElementById('adminPass').value = '';
            document.getElementById('passModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('adminPass').focus(), 100);
        }

        function verificarClave() {
            if (document.getElementById('adminPass').value === "4TR4$") {
                document.getElementById('passModal').classList.add('hidden');
                document.getElementById('adminModal').classList.remove('hidden');
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function cerrarAdmin() {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminForm').reset();
            document.getElementById('adminMsg').classList.add('hidden');
        }

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardarProv');
            const msg = document.getElementById('adminMsg');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            const payload = {
                action: 'guardarProveedor',
                proveedor: document.getElementById('nuevoProveedor').value.toUpperCase().trim(),
                correos: document.getElementById('nuevoCorreos').value.toLowerCase().trim()
            };

            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                msg.textContent = "¡Proveedor guardado exitosamente!";
                msg.className = "text-sm text-center font-bold mt-3 text-green-600 block";
                document.getElementById('adminForm').reset();
                setTimeout(() => { cerrarAdmin(); cargarDatosGenerales(); }, 1500);
            } catch (error) {
                msg.textContent = "Error al guardar el proveedor.";
                msg.className = "text-sm text-center font-bold mt-3 text-red-600 block";
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> Guardar en Base de Datos';
                btn.disabled = false;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            const payload = {
                action: 'nuevoTicket',
                proveedor: document.getElementById('proveedor').value,
                proyecto: document.getElementById('proyecto').value,
                unidad: document.getElementById('unidad').value.toUpperCase(),
                prioridad: document.getElementById('prioridad').value,
                incidencia: document.getElementById('incidencia').value
            };

            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                statusMsg.textContent = "¡Enviado con éxito!";
                statusMsg.className = "text-sm text-center font-bold mt-3 text-green-600 block";
                form.reset();
                setTimeout(cargarDatosGenerales, 1500);
            } catch (error) {
                statusMsg.textContent = "Error de conexión.";
                statusMsg.className = "text-sm text-center font-bold mt-3 text-red-600 block";
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar y Notificar';
                btn.disabled = false;
                setTimeout(() => statusMsg.classList.add('hidden'), 5000);
            }
        });

        async function cargarDatosGenerales() {
            const tbody = document.getElementById('tablaCuerpo');
            const selectProv = document.getElementById('proveedor');
            
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Cargando información...</td></tr>';
            
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                if(data.proveedores) {
                    selectProv.innerHTML = '<option value="">Seleccionar...</option>';
                    data.proveedores.forEach(prov => {
                        selectProv.insertAdjacentHTML('beforeend', `<option value="${prov.nombre}">${prov.nombre}</option>`);
                    });
                }

                tbody.innerHTML = '';
                let abiertos = 0, proximos = 0, vencidos = 0;
                const ahora = new Date();
                
                (data.tickets || data).forEach(t => { 
                    let colorEstado = 'bg-slate-100 text-slate-700'; 
                    let horasSLA = 0;
                    let htmlSLA = '';
                    let botonAccion = '';
                    let rowClass = "hover:bg-slate-50 transition-colors border-b border-slate-100";
                    let rowIcon = "";

                    if (t.estado !== 'Cerrada') {
                        const fechaInicio = new Date(t.fecha);
                        horasSLA = Math.floor((ahora - fechaInicio) / (1000 * 60 * 60));
                        abiertos++;
                        
                        if (horasSLA >= 48) { vencidos++; htmlSLA = `<span class="text-red-600 font-bold"><i class="fas fa-exclamation-triangle"></i> ${horasSLA} hrs</span>`; }
                        else if (horasSLA >= 24) { proximos++; htmlSLA = `<span class="text-amber-500 font-bold"><i class="fas fa-clock"></i> ${horasSLA} hrs</span>`; }
                        else { htmlSLA = `<span class="text-slate-600 font-medium">${horasSLA} hrs</span>`; }
                        
                        // Resaltado visual para tickets críticos
                        if (t.prioridad === 'Crítica') {
                            rowClass = "bg-red-50 hover:bg-red-100 transition-colors border-b border-red-200";
                            rowIcon = `<i class="fas fa-fire text-red-500 mr-2" title="Ticket Crítico"></i>`;
                        }
                    } else {
                        htmlSLA = `<span class="text-green-500 font-bold"><i class="fas fa-check-double"></i> Finalizado</span>`;
                    }

                    if(t.estado === 'Pendiente') colorEstado = 'bg-amber-100 text-amber-700';
                    if(t.estado === 'En atención') colorEstado = 'bg-blue-100 text-blue-700';
                    if(t.estado === 'En Verificación') {
                        colorEstado = 'bg-purple-100 text-purple-700 font-bold animate-pulse ring-2 ring-purple-300';
                        botonAccion = `<button onclick="cerrarTicket('${t.ticket}')" class="bg-purple-600 hover:bg-purple-800 text-white px-3 py-1 rounded-md text-xs font-bold transition-colors shadow-md"><i class="fas fa-check-circle mr-1"></i> Aprobar</button>`;
                    }
                    if(t.estado === 'Cerrada') colorEstado = 'bg-green-100 text-green-700';

                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="${rowClass}">
                            <td class="p-4 font-bold" style="color: #1A52A0;">${rowIcon}${t.ticket}</td>
                            <td class="p-4 font-semibold text-slate-700">${t.proveedor}</td>
                            <td class="p-4 font-bold uppercase">${t.unidad}</td>
                            <td class="p-4"><span class="${colorEstado} py-1 px-3 rounded-full text-xs">${t.estado}</span></td>
                            <td class="p-4">${htmlSLA}</td>
                            <td class="p-4 text-center">${botonAccion}</td>
                        </tr>
                    `);
                });
                
                document.getElementById('kpi-abiertos').textContent = abiertos;
                document.getElementById('kpi-proximos').textContent = proximos;
                document.getElementById('kpi-vencidos').textContent = vencidos;
                
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500"><i class="fas fa-times-circle mr-1"></i> Error de conexión</td></tr>';
            }
        }

        async function cerrarTicket(ticketId) {
            if(!confirm(`¿Desea aprobar y cerrar definitivamente el ticket ${ticketId}?`)) return;
            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'cerrar', ticket: ticketId })
                });
                setTimeout(cargarDatosGenerales, 1000); 
            } catch (error) {
                alert("Hubo un error al cerrar el ticket.");
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDatosGenerales);
    </script>
</body>
</html>
